<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Design serpentine antenna measurement grids in azimuth/elevation or pan/tilt coordinates.">
        <title>Grid Designer · LEMS Anechoic</title>
        <link rel="stylesheet" href="{{ url_for('static', path='grid-designer.css') }}">
        <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
        <script src="/vendor/plotly.min.js" defer></script>
        <script src="{{ url_for('static', path='grid-designer.js') }}" defer></script>
    </head>
    <body>
        <header class="site-header">
            <a class="application-name" href="/grid-designer">LEMS Anechoic Chamber</a>
            <span class="current-page">Grid Designer</span>
        </header>

        <main>
            <div class="page-heading">
                <h1>Grid Designer</h1>
                <p>Define a rectangular measurement grid and inspect it in both coordinate systems.</p>
            </div>

            <form
                id="grid-form"
                class="designer-panel"
                hx-get="/grid-designer/preview"
                hx-target="#grid-preview"
                hx-swap="outerHTML"
                hx-trigger="input changed delay:350ms, change"
                hx-indicator="#updating-indicator"
            >
                <div class="panel-heading">
                    <h2>Grid parameters</h2>
                    <div class="coordinate-switch" role="radiogroup" aria-label="Input coordinate system">
                        <label>
                            <input type="radio" name="input_system" value="az_el" checked>
                            <span>Azimuth / elevation</span>
                        </label>
                        <label>
                            <input type="radio" name="input_system" value="pan_tilt">
                            <span>Pan / tilt</span>
                        </label>
                    </div>
                </div>

                <div class="coordinate-fields" data-coordinate-fields="az_el">
                    <fieldset>
                        <legend>Azimuth <span>horizontal axis</span></legend>
                        <div class="input-grid">
                            <label>Minimum <span class="number-input"><input name="azimuth_min" type="number" step="any" value="{{ azimuth_min }}" required><b>°</b></span></label>
                            <label>Maximum <span class="number-input"><input name="azimuth_max" type="number" step="any" value="{{ azimuth_max }}" required><b>°</b></span></label>
                            <label>Step size <span class="number-input"><input name="azimuth_step" type="number" min="0.000001" step="any" value="{{ azimuth_step }}" required><b>°</b></span></label>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Elevation <span>vertical axis</span></legend>
                        <div class="input-grid">
                            <label>Minimum <span class="number-input"><input name="elevation_min" type="number" step="any" value="{{ elevation_min }}" required><b>°</b></span></label>
                            <label>Maximum <span class="number-input"><input name="elevation_max" type="number" step="any" value="{{ elevation_max }}" required><b>°</b></span></label>
                            <label>Step size <span class="number-input"><input name="elevation_step" type="number" min="0.000001" step="any" value="{{ elevation_step }}" required><b>°</b></span></label>
                        </div>
                    </fieldset>
                </div>

                <div class="coordinate-fields" data-coordinate-fields="pan_tilt" hidden>
                    <fieldset>
                        <legend>Pan <span>horizontal axis</span></legend>
                        <div class="input-grid">
                            <label>Minimum <span class="number-input"><input name="pan_min" type="number" step="any" value="{{ pan_min }}" required><b>°</b></span></label>
                            <label>Maximum <span class="number-input"><input name="pan_max" type="number" step="any" value="{{ pan_max }}" required><b>°</b></span></label>
                            <label>Step size <span class="number-input"><input name="pan_step" type="number" min="0.000001" step="any" value="{{ pan_step }}" required><b>°</b></span></label>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Tilt <span>vertical axis</span></legend>
                        <div class="input-grid">
                            <label>Minimum <span class="number-input"><input name="tilt_min" type="number" step="any" value="{{ tilt_min }}" required><b>°</b></span></label>
                            <label>Maximum <span class="number-input"><input name="tilt_max" type="number" step="any" value="{{ tilt_max }}" required><b>°</b></span></label>
                            <label>Step size <span class="number-input"><input name="tilt_step" type="number" min="0.000001" step="any" value="{{ tilt_step }}" required><b>°</b></span></label>
                        </div>
                    </fieldset>
                </div>
                <div class="form-footnote">
                    <span id="updating-indicator" class="htmx-indicator">Updating views…</span>
                </div>
            </form>

            {% include "_grid_preview.html" %}
        </main>
    </body>
</html>
