<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>3D experiment</title>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
                }
            }
        </script>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
                background: #111;
            }

            .controls {
                position: fixed;
                z-index: 1;
                top: 1rem;
                left: 1rem;
                display: grid;
                gap: 0.65rem;
                padding: 1rem;
                color: white;
                background: rgb(15 18 22 / 85%);
                border: 1px solid #68717c;
                border-radius: 0.5rem;
                font: 16px sans-serif;
                max-height: calc(100vh - 4rem);
                overflow-y: auto;
            }

            .controls[hidden] {
                display: none;
            }

            .settings-toggle {
                position: fixed;
                z-index: 2;
                top: 1rem;
                right: 1rem;
                padding: 0.4rem 0.65rem;
                color: white;
                background: rgb(15 18 22 / 85%);
                border: 1px solid #68717c;
                border-radius: 0.4rem;
                font: 14px sans-serif;
                cursor: pointer;
            }

            .controls label {
                display: grid;
                grid-template-columns: 7rem 6rem 2.5rem minmax(10rem, 20vw);
                align-items: center;
                gap: 0.5rem;
            }

            .animation-controls {
                display: grid;
                grid-template-columns: 7rem 6rem 2.5rem minmax(10rem, 20vw);
                align-items: center;
                gap: 0.5rem;
                margin-top: -0.35rem;
                margin-bottom: 0.25rem;
            }

            .animation-bounds {
                display: grid;
                grid-template-columns: 7rem 6rem 2.5rem 6rem 2.5rem;
                align-items: center;
                gap: 0.5rem;
                margin-top: -0.35rem;
                margin-bottom: 0.25rem;
            }

            .controls input {
                width: 100%;
                box-sizing: border-box;
                padding: 0.35rem 0.45rem;
                font: inherit;
            }

            .controls input[type="range"] {
                padding: 0;
            }

            .controls button {
                padding: 0.4rem 0.6rem;
                color: white;
                background: #3d536b;
                border: 1px solid #8291a1;
                border-radius: 0.3rem;
                font: inherit;
                cursor: pointer;
            }

            .trail-actions {
                display: flex;
                align-items: center;
                gap: 1rem;
            }

            .controls .trail-actions label {
                display: flex;
                align-items: center;
                gap: 0.4rem;
            }

            .controls .trail-actions input {
                width: auto;
            }
        </style>
    </head>
    <body>
        <button id="settings-toggle" class="settings-toggle" type="button" aria-controls="settings-panel" aria-expanded="true">Settings</button>
        <div id="settings-panel" class="controls">
            <label>
                <span>Pan</span>
                <input id="pan" type="number" value="0" min="-180" max="180" step="1">
                <span>deg</span>
                <input id="pan-slider" type="range" value="0" min="-180" max="180" step="1">
            </label>
            <div class="animation-controls">
                <span>Pan speed</span>
                <span></span>
                <output id="pan-animation-speed-output">60 deg/s</output>
                <input id="pan-animation-speed" type="range" value="60" min="0" max="180" step="1">
            </div>
            <div class="animation-bounds">
                <span>Pan limits</span>
                <input id="pan-animation-min" type="number" value="-60" min="-180" max="180" step="1">
                <span>to</span>
                <input id="pan-animation-max" type="number" value="60" min="-180" max="180" step="1">
                <span>deg</span>
            </div>
            <label>
                <span>Tilt</span>
                <input id="tilt" type="number" value="0" min="-90" max="45" step="1">
                <span>deg</span>
                <input id="tilt-slider" type="range" value="0" min="-90" max="45" step="1">
            </label>
            <div class="animation-controls">
                <span>Tilt speed</span>
                <span></span>
                <output id="tilt-animation-speed-output">60.0 deg/s</output>
                <input id="tilt-animation-speed" type="range" value="60" min="0" max="180" step="0.5">
            </div>
            <div class="animation-bounds">
                <span>Tilt limits</span>
                <input id="tilt-animation-min" type="number" value="-30" min="-90" max="45" step="1">
                <span>to</span>
                <input id="tilt-animation-max" type="number" value="20" min="-90" max="45" step="1">
                <span>deg</span>
            </div>
            <div class="animation-bounds">
                <span>Tilt step</span>
                <input id="tilt-animation-step" type="number" value="10" min="0.1" max="135" step="0.5">
                <span>deg</span>
            </div>
            <label>
                <span>Height</span>
                <input id="height" type="number" value="0.2" min="0" max="1" step="0.01">
                <span>m</span>
                <input id="height-slider" type="range" value="0.2" min="0" max="1" step="0.01">
            </label>
            <div class="animation-controls">
                <span>Lift speed</span>
                <span></span>
                <output id="height-animation-speed-output">0.00 m/s</output>
                <input id="height-animation-speed" type="range" value="0" min="0" max="1" step="0.01">
            </div>
            <div class="animation-bounds">
                <span>Lift limits</span>
                <input id="height-animation-min" type="number" value="0" min="0" max="1" step="0.01">
                <span>to</span>
                <input id="height-animation-max" type="number" value="1" min="0" max="1" step="0.01">
                <span>m</span>
            </div>
            <div class="animation-controls">
                <span>Motion</span>
                <button id="motion-animation-toggle" type="button">Start</button>
                <span></span>
                <span>Animate enabled axes</span>
            </div>
            <label>
                <span>Screen radius</span>
                <output id="screen-radius-output">1.50 m</output>
                <span></span>
                <input id="screen-radius" type="range" value="1.5" min="0.1" max="5" step="0.05">
            </label>
            <label>
                <span>Sample interval</span>
                <output id="trail-sample-interval-output">100 ms</output>
                <span></span>
                <input id="trail-sample-interval" type="range" value="100" min="20" max="2000" step="20">
            </label>
            <div class="trail-actions">
                <label><input id="trail-enabled" type="checkbox" checked> Track boresight</label>
                <button id="trail-clear" type="button">Clear</button>
            </div>
            <label>
                <span>Back lights</span>
                <output id="back-light-intensity-output">800.0</output>
                <span></span>
                <input id="back-light-intensity" type="range" value="800" min="0" max="5000" step="10">
            </label>
            <label>
                <span>Flood lights</span>
                <output id="flood-light-intensity-output">800.0</output>
                <span></span>
                <input id="flood-light-intensity" type="range" value="800" min="0" max="5000" step="10">
            </label>
            <label>
                <span>Fill light</span>
                <output id="fill-light-intensity-output">0.0</output>
                <span></span>
                <input id="fill-light-intensity" type="range" value="0" min="0" max="10" step="0.1">
            </label>
            <label>
                <span>Directional</span>
                <output id="directional-light-intensity-output">0.0</output>
                <span></span>
                <input id="directional-light-intensity" type="range" value="0" min="0" max="10" step="0.1">
            </label>
            <label>
                <span>Walls</span>
                <output id="wall-opacity-output">5%</output>
                <span></span>
                <input id="wall-opacity" type="range" value="0.05" min="0" max="1" step="0.01">
            </label>
            <label>
                <span>Rotation</span>
                <button id="rotation-toggle" type="button">Start</button>
                <output id="rotation-speed-output">5.0x</output>
                <input id="rotation-speed" type="range" value="5" min="0.1" max="5" step="0.1">
            </label>
        </div>
        <canvas id="chamber-canvas"></canvas>
        <script type="module" src="{{ url_for('static', path='3d.js') }}"></script>
    </body>
</html>
