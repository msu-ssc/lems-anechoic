[project]
name = "lems-anechoic"
dynamic = ["version"]
description = "MSU SSC anechoic chamber test scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "comtypes>=1.4.11; sys_platform == 'win32'",
    "dash>=4.4.1",
    "fastapi>=0.116",
    "jinja2>=3.1",
    "matplotlib>=3.10.0",
    "msu-ssc>=1.0.0",
    "numpy>=2.2.2",
    "onnxruntime>=1.11,<1.24; python_version < '3.11'",
    "pandas>=2.2.3",
    "plotly>=6.3",
    "piper-tts>=1.4.2",
    "pydantic>=2.10.6",
    "pyserial>=3.5",
    "pyvisa>=1.14.1",
    "scipy>=1.15.2",
    "uvicorn[standard]>=0.35",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm.version]
source = "scm"
fallback_version = "0.0.0"


[project.optional-dependencies]
mayo = [
    "scipy>=1.15.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "F541", # f-string without any placeholders
    "E501", # line too long
]

extend-select = [
    "I001",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["lems_a3", "moc_tools"]

[project.urls]
Homepage = "https://github.com/msu-ssc/lems-anechoic"
Source = "https://github.com/msu-ssc/lems-anechoic"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "playwright>=1.61.0",
    "pytest>=8.3.4",
]
